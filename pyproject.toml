[project]
name = "cof"
version = "0.1.0"
description = "Corrective Forcing (CoF): unified post-training for diffusion- and flow-based generative speech enhancement"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Qing Yao", email = "qyao@stmail.ujs.edu.cn" }]
requires-python = ">=3.12,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.30.2",
    "librosa>=0.11.0",
    "lightning>=2.5.0",
    "ninja",
    "numpy>=2.0",
    "pandas>=2.3.0",
    "pesq>=0.0.4",
    "pystoi>=0.4.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "rich>=13.7.0",
    "safetensors>=0.7.0",
    "scipy>=1.14",
    "soundfile>=0.13.1",
    "tabulate>=0.9.0",
    "torch>=2.7,<3",
    "torchaudio>=2.7,<3",
    "torchcodec>=0.16",
    "torchmetrics==1.9.0",
    "tqdm>=4.67.1",
    "typer>=0.12.0",
    "wandb",
]

[project.scripts]
cof = "cof.cli.app:app"

[project.urls]
Homepage = "https://github.com/Yorch233/CoF"
Repository = "https://github.com/Yorch233/CoF"
"Hugging Face" = "https://huggingface.co/Yorch233/CoF"
ModelScope = "https://www.modelscope.cn/models/Yorch233/CoF"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["cof"]

[tool.ruff]
line-length = 120
lint.extend-select = [
    "ANN",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "PT",
    "RET",
    "S",
    "SIM",
    "UP",
    "W",
]
lint.ignore = [
    "ANN401",
    "D100",
    "D104",
    "S101",
    "S311",
]
lint.flake8-annotations.allow-star-arg-any = true
lint.pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = ["ANN", "D"]
# Upstream-derived NCSN++ utilities keep their original style; only first-party
# code is held to the project lint standard.
"cof/backbone/ncsnpp/ncsnpp_utils/**" = [
    "ANN", "C4", "COM", "D", "E", "EM", "F", "I", "PT", "RET", "S", "SIM", "TC", "UP", "W",
]

[tool.mypy]
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
